name: xai-car-cp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carprice}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # trust = passwordless lokal. Isi POSTGRES_PASSWORD + ganti ke scram-sha-256 bila butuh password.
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-carprice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@carprice.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      # Desktop mode = tanpa layar login; server carprice terdaftar otomatis via servers.json.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_DESKTOP_USER: "'${PGADMIN_DEFAULT_EMAIL:-admin@carprice.app}'"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_GLOBALLY_DELIVERABLE: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app@postgres:5432/carprice}
      MODEL_DIR: /app/artifacts
      MODEL_VERSION: ${MODEL_VERSION:-xgb-v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      INFERENCE_TIMEOUT_S: ${INFERENCE_TIMEOUT_S:-10}
      SEED_CSV_PATH: /app/seed/used_filtered.csv
      SEED_FALLBACK_CSV_PATH: /app/dataset.csv
    volumes:
      - ./artifacts/models/xgboost/${MODEL_VERSION:-xgb-v1}:/app/artifacts:ro
      - ./data/processed:/app/seed:ro
      - ./dataset.csv:/app/dataset.csv:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  pgadmin_data:
