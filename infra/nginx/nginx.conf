resolver 127.0.0.11 valid=10s;

# Port 80 = User Portal (publik).
server {
  listen 80;

  location /api/ {
    set $backend_up http://backend:8000;
    proxy_pass $backend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location / {
    set $frontend_up http://frontend:80;
    proxy_pass $frontend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# Port 8081 = Developer Portal (konsol teknis). Di docker-compose port
# ini hanya di-bind ke loopback host, sehingga user biasa tidak bisa
# mengaksesnya via jaringan. /api + /docs ikut diproxy agar portal
# tetap same-origin (tanpa masalah CORS).
server {
  listen 8081;

  location /api/ {
    set $backend_up http://backend:8000;
    proxy_pass $backend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # Swagger UI / OpenAPI milik FastAPI untuk modul API Explorer di Developer Portal.
  location = /docs {
    set $backend_up http://backend:8000;
    proxy_pass $backend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /openapi.json {
    set $backend_up http://backend:8000;
    proxy_pass $backend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    set $frontend_up http://frontend:8081;
    proxy_pass $frontend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
