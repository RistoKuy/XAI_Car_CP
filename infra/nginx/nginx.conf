resolver 127.0.0.11 valid=10s;

server {
  listen 80;

  location /api/ {
    set $backend_up http://backend:8000;
    proxy_pass $backend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location / {
    set $frontend_up http://frontend:80;
    proxy_pass $frontend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
