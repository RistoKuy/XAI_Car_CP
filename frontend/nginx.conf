# Port 80 = User Portal SAJA. developer.html dan chunk JS khusus
# developer diblokir agar user biasa tidak bisa membukanya dari port publik.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend_up http://backend:8000;
    proxy_pass $backend_up;
    proxy_set_header Host $host;
  }

  location = /developer.html {
    return 404;
  }

  location ~* ^/assets/developer {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Port 8081 = Developer Portal SAJA. Di docker-compose port ini hanya
# di-bind ke loopback host, sehingga tidak terekspos ke user biasa.
server {
  listen 8081;
  root /usr/share/nginx/html;
  index developer.html;

  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend_up http://backend:8000;
    proxy_pass $backend_up;
    proxy_set_header Host $host;
  }

  location = /index.html {
    return 404;
  }

  location / {
    try_files $uri $uri/ /developer.html;
  }
}
